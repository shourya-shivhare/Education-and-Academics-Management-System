# =============================================================================
# application.yml – Spring Boot 3 configuration for edu_db
# Two datasources:
#   flyway_user  – used only by Flyway at startup (DDL + grants)
#   app_user     – used by the application at runtime (DML / CALL)
# =============================================================================

server:
  port: 8080
  servlet:
    context-path: /

spring:
  # ── Primary datasource (app_user – runtime DML) ───────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/edu_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: app_user
    password: ChangeMe_app_2026!
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: AppPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── Secondary datasource (flyway_user – migrations only) ─────────────────
  flyway-datasource:
    url: jdbc:mysql://localhost:3306/edu_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: flyway_user
    password: ChangeMe_flyway_2026!
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: FlywayPool
      maximum-pool-size: 2
      minimum-idle: 1

  # ── Disable Spring Boot's auto-configured Flyway (we configure it manually) ──
  flyway:
    enabled: false   # we register our own Flyway bean with flyway_user

  # ── Disable JPA auto-configuration entirely (NO Hibernate / ddl-auto) ─────
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# ── Application-level properties ─────────────────────────────────────────────
app:
  internal-key: dev-internal-secret-change-me  # X-Internal-Key for the Python service
  cors:
    # Comma-separated string (not a YAML list) – @Value splits this at runtime
    allowed-origins: "http://localhost:5173,http://localhost:5174"
  jwt:
    # HS256 secret – at least 256 bits (32 bytes) when decoded.
    # This is a Base64-encoded dev secret. REPLACE before any real deployment.
    # Generate a strong one with: openssl rand -base64 32
    secret: "Y2hhbmdlTWVUb0FTdHJvbmdTZWNyZXRCZWZvcmVQcm9kdWN0aW9uMjAyNg=="
    # Token lifetime in milliseconds (default 8 hours for a dev session)
    expiration-ms: 28800000

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    edu.dbms: DEBUG
    org.springframework.jdbc: DEBUG
    org.flywaydb: INFO
