# =============================================================================
# docker-compose.yml – EduManage development stack
#
# Services:
#   db       – MySQL 8.4 (InnoDB, utf8mb4)
#   ai       – internal FastAPI ML service
#   backend  – Spring Boot API
#   frontend – Nginx-served React application
#              Auto-runs database/setup/00_create_database_and_users.sql
#              on first start via docker-entrypoint-initdb.d/
#
# Usage:
#   docker compose up -d          # start MySQL in background
#   docker compose logs -f db     # tail MySQL logs
#   docker compose down           # stop (keeps volume)
#   docker compose down -v        # stop + delete volume (full reset)
#
# Usage:
#   docker compose up --build -d
#   open http://localhost:5173
# =============================================================================

services:
  db:
    image: mysql:8.4
    container_name: edumanage_mysql
    restart: unless-stopped

    environment:
      # Root password – dev only
      MYSQL_ROOT_PASSWORD: root
      # Pre-create edu_db so the bootstrap SQL finds it
      MYSQL_DATABASE: edu_db
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_0900_ai_ci

    ports:
      # Expose 3306 → localhost:3306 so Spring Boot can connect
      - "3306:3306"

    volumes:
      # Persist data between restarts
      - mysql_data:/var/lib/mysql

      # ── Bootstrap SQL ──────────────────────────────────────────────────────
      # Any .sql file in this directory is executed automatically on the
      # FIRST container start (when /var/lib/mysql is empty).
      # This creates flyway_user, app_user, grants, and the FLUSH.
      - ./database/setup/00_create_database_and_users.sql:/docker-entrypoint-initdb.d/00_bootstrap.sql:ro

    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-time-zone=+00:00
      --log-bin-trust-function-creators=ON

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ai:
    build:
      context: ./ai-service
    container_name: edumanage_ai
    restart: unless-stopped
    environment:
      ML_DATABASE_URL: mysql+pymysql://ml_readonly:ChangeMe_ml_2026!@db:3306/edu_db
      ML_INTERNAL_KEY: dev-internal-secret-change-me
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: edumanage_backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/edu_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_JDBC_URL: jdbc:mysql://db:3306/edu_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_FLYWAY_DATASOURCE_JDBC_URL: jdbc:mysql://db:3306/edu_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      APP_AI_SERVICE_URL: http://ai:8001
      APP_INTERNAL_KEY: dev-internal-secret-change-me
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    ports:
      - "8081:8080"

  frontend:
    build:
      context: ./frontend
    container_name: edumanage_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
    driver: local
